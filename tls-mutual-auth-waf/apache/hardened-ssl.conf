# hardened-ssl.conf — Apache virtual hosts for the TLS lab.
# Drop into /etc/apache2/sites-available/ and enable with:
#   a2enmod ssl headers rewrite
#   a2ensite hardened-ssl
#   systemctl reload apache2

# --- Port 80: redirect everything to HTTPS ------------------------------------
<VirtualHost *:80>
    ServerName 192.168.56.10
    DocumentRoot /var/www/html

    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^/?(.*)$ https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

# --- Port 443: hardened TLS endpoint ------------------------------------------
<VirtualHost *:443>
    ServerName 192.168.56.10
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile    /etc/ssl/lab/server.crt
    SSLCertificateKeyFile /etc/ssl/lab/server.key
    SSLCACertificateFile  /etc/ssl/lab/ca.crt

    # Only modern protocols. SSLv3 / TLSv1.0 / TLSv1.1 are refused.
    SSLProtocol            -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder    on
    SSLCipherSuite         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLCompression         off
    SSLSessionTickets      off

    # HSTS: once a browser has seen this, it refuses plain HTTP for a year.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"

    # Public site: no client certificate required.
    SSLVerifyClient none

    # --- Mutual TLS: /private requires a client cert signed by our CA ----------
    <Directory "/var/www/html/private">
        SSLVerifyClient require
        SSLVerifyDepth  2
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/ssl-access.log combined
</VirtualHost>

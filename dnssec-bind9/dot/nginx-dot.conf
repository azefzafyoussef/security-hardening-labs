# DNS-over-TLS front end.
# Clients speak TLS to nginx on 853; nginx forwards plain DNS to BIND on 53.
# This adds DoT even though BIND itself is not terminating TLS.
# Place in /etc/nginx/nginx.conf (stream block is top-level, not inside http).
stream {
    upstream dns_backend {
        server 127.0.0.1:53;
    }

    server {
        listen 853 ssl;
        ssl_certificate     /etc/nginx/ssl/dot.crt;
        ssl_certificate_key /etc/nginx/ssl/dot.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        proxy_pass dns_backend;
    }
}
